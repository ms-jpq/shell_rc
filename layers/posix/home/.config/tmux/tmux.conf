%hidden tmux_dir="$HOME/.config/tmux"
%hidden tmux_conf_dir="$tmux_dir/conf"
%hidden tmux_bin_dir="$tmux_dir/libexec"

source -F -- '#{tmux_conf_dir}/opts.conf'
source -F -- '#{tmux_conf_dir}/theme.conf'
source -F -- '#{tmux_conf_dir}/keybind.conf'
source -F -- '#{tmux_conf_dir}/nested.conf'
source -F -- '#{tmux_conf_dir}/hooks.conf'
