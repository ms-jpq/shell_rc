#################### ############# ####################
#################### Unbind Region ####################
#################### ############# ####################

# Unbind all keys
unbind-key <    # menu
unbind-key >    # menu
unbind-key "\$" # rename-session
unbind-key ,    # rename-window
unbind-key %    # split-window -h
unbind-key '"'  # split-window
unbind-key "}"  # swap-pane -D
unbind-key "{"  # swap-pane -U
unbind-key [    # paste-buffer
unbind-key ]
unbind-key D    # choose-client
unbind-key f    # find-window
unbind-key "'"  # select-window
unbind-key n    # next-window
unbind-key p    # previous-window
unbind-key l    # last-window
unbind-key M-n  # next window with alert
unbind-key M-p  # next window with alert
unbind-key M-o  # rotate window
unbind-key o    # focus thru panes
unbind-key &    # kill-window
unbind-key x    # kill pane
unbind-key "#"  # list-buffer
unbind-key =    # choose-buffer
unbind-key "."  # move window
unbind-key M-Up    # resize 5 rows up
unbind-key M-Down  # resize 5 rows down
unbind-key M-Right # resize 5 rows right
unbind-key M-Left  # resize 5 rows left
unbind-key Up      # select up pane
unbind-key Down    # select down pane
unbind-key Left    # select left pane
unbind-key Right   # select right pane
unbind-key Space   # next-layout
unbind-key -T copy-mode-vi y
unbind-key -T copy-mode-vi c


#################### ########### ####################
#################### ANSI Region ####################
#################### ########### ####################

bind-key -n BTab send-keys -l "\e[Z"


#################### ########### ####################
#################### Base Region ####################
#################### ########### ####################

# status line
set-option -g status-keys emacs

# copy mode
set-option -g mode-keys vi


#################### ############# ####################
#################### Leader Region ####################
#################### ############# ####################

## Bind leader key
set-option -g prefix2 M-`
bind-key M-` send-prefix -2

# Copy mode
bind-key v   copy-mode

# Sync mode
bind-key B   set-window-option synchronize-panes


#################### ########## ####################
#################### Ops Region ####################
#################### ########## ####################

bind-key Q   confirm-before -p "kill-session #S? (y/n)" kill-session

bind-key R   source "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display-message ">>> tmux.conf"

bind-key r   move-window -r \; refresh-client

## clear scrollback
bind-key l   clear-history


#################### ############# ####################
#################### Scroll Region ####################
#################### ############# ####################

# Scroll one line at a time
bind-key -T copy-mode-vi WheelUpPane \
  send-keys -X -N 3 scroll-up

bind-key -T copy-mode-vi WheelDownPane \
  send-keys -X -N 3 scroll-down


#################### ########### ####################
#################### Copy Region ####################
#################### ########### ####################

bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key p   paste-buffer -p

bind-key -T copy-mode-vi "{" send-keys -N 9 -X cursor-up
bind-key -T copy-mode-vi "}" send-keys -N 9 -X cursor-down

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe \;\
  send-keys -X clear-selection


# Dont exit copy mode on mouse end
bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X stop-selection

bind-key -T copy-mode-vi MouseDown1Pane \
  select-pane \;\
  send-keys -X copy-pipe \;\
  send-keys -X clear-selection


#################### ############## ####################
#################### Windows Region ####################
#################### ############## ####################

bind-key N   new-window
bind-key n   new-window -a -c "#{pane_current_path}"

bind-key q   kill-window

bind-key -r  "[" previous-window
bind-key -r  "]" next-window

bind-key -r  Tab last-window
bind-key -r  0   last-window

bind-key -r  "{" swap-window -t -1\; select-window -t -1
bind-key -r  "}" swap-window -t +1\; select-window -t +1


#################### ############ ####################
#################### Panes Region ####################
#################### ############ ####################

bind-key =   split-window -h -c "#{pane_current_path}"
bind-key -   split-window -v -c "#{pane_current_path}"

bind-key w   kill-pane
bind-key c   display-panes -b -d 0

bind-key -r ";"   rotate-window -D
bind-key -r "'"   rotate-window -U


bind-key Up    select-pane -U
bind-key Down  select-pane -D
bind-key Left  select-pane -L
bind-key Right select-pane -R

bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

bind-key K swap-pane -U
bind-key J swap-pane -D

bind-key -r S-Up    resize-pane -U 6
bind-key -r S-Down  resize-pane -D 6
bind-key -r S-Left  resize-pane -L 6
bind-key -r S-Right resize-pane -R 6

# layout
bind-key Space display-menu -T "Layout" \
  "1: even-horizontal" 1 "select-layout even-horizontal" \
  "2: even-vertical"   2 "select-layout even-vertical" \
  "3: tiled"           3 "select-layout tiled" \
  "4: main-horizontal" 4 "select-layout main-horizontal" \
  "5: main-vertical"   5 "select-layout main-vertical"


# zoom
bind-key x if-shell -F '#{||:#{window_zoomed_flag},#{!=:#{window_panes},1}}' 'resize-pane -Z' 'split-window -h -d -c "#{pane_current_path}"'


## put pane into own window
bind-key y   break-pane -a

## send pane
bind-key t   choose-tree -G -Z -NN -- "move-pane -h -t '%%'"
## receive pane
bind-key T   choose-tree -G -Z -NN -- "move-pane -h -s '%%'"

## choose session
bind-key a   choose-tree -G -Z -s -NN
## choose window
bind-key s   choose-tree    -Z -w -NN -f '#{session_attached}'

#################### ############ ####################
#################### Popup Region ####################
#################### ############ ####################

bind-key i display-popup -k -EE -d "#{pane_current_path}" -- "$SHELL" -ti
bind-key I new-window -a -c "#{pane_current_path}" -- "~/.config/zsh/bin/yz"

bind-key u new-window -a -c "#{pane_current_path}" -- git difftool --dir-diff -- .
bind-key U new-window -a -c "#{pane_current_path}" -- ~/.config/zsh/bin/la

bind-key e new-window -a -c "#{pane_current_path}" -- 'nvim "+autocmd TermClose * ++once norm! ggGMzz" "+terminal tmux capture-pane -e -J -S - -E - -t {last} -p"'
bind-key E new-window -a -c "#{pane_current_path}" -- 'nvim "+autocmd TermClose * ++once norm! ggGMzz" "+terminal tmux capture-pane    -J -S - -E - -t {last} -p"'

