#################### ########### ####################
#################### Term Region ####################
#################### ########### ####################

set-option -g allow-passthrough on

set-option -g detach-on-destroy on

set-option -g default-terminal "xterm-256color"
set-option -g -a terminal-features ",*:hyperlinks"

set-option -g extended-keys always
# set-option -g extended-keys-format csi-u

# https://github.com/tmux/tmux/issues/4081
set-option -g -a terminal-overrides ",xterm-256color:Tc:Ms=\\E]52;c%p1%.0s;%p2%s\\E\\"

set-window-option -g xterm-keys on

set-option -g mouse on
set-option -g set-clipboard on

set-option -g history-limit 666666

set-option -g focus-events on

set-option -g update-environment "TZ SSH_AUTH_SOCK SSH_AGENT_PID SSH_CLIENT SSH_CONNECTION SSH_TTY KITTY_LISTEN_ON"


#################### ############### ####################
#################### Keyboard Region ####################
#################### ############### ####################

## larger value required on remote connections
## time between escape seq
set-option -s escape-time 0

## sticky time after repeated commands
set-option -sg repeat-time 500


#################### ############# ####################
#################### Status Region ####################
#################### ############# ####################

set-option -g status-interval 1


#################### ######### ####################
#################### WM Region ####################
#################### ######### ####################

set-option -g base-index 1

set-window-option -g pane-base-index 1

set-window-option -g automatic-rename on

set-window-option -g allow-rename on

set-option -g renumber-windows on

set-option -g set-titles on

set-window-option -g aggressive-resize on


#################### ############## ####################
#################### Display Region ####################
#################### ############## ####################

set-option -g display-panes-time 8888

set-option -g display-time 1000


#################### ########### ####################
#################### Misc Region ####################
#################### ########### ####################

set-option -g clock-mode-style 24
