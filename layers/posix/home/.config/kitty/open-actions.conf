protocol file
mime inode/directory
action launch --type=os-window --cwd=current -- bash -c '"$HOME/.local/libexec/yazi.sh" -- "$1"' _ ${FILE_PATH}

protocol file
fragment_matches .+
action launch --type=os-window --cwd=current -- nvim +${FRAGMENT} -- ${FILE_PATH}

protocol file
action launch --type=os-window --cwd=current -- nvim -- ${FILE_PATH}
