"$schema"    = 'https://starship.rs/config-schema.json'
add_newline  = false
format       = "$directory$git_branch$fill$env_var$shell$username$hostname$line_break$character"
right_format = "$cmd_duration$status"

[directory]
format            = "[ $path]($style) "
style             = 'blue'
truncate_to_repo  = false
truncation_length = 0
truncation_symbol = ''

[git_branch]
format = '[$symbol$branch]($style) '
style  = 'green'
symbol = " "

[fill]
symbol = ' '

[env_var.LF_LEVEL]
format   = '[ LF$env_value]($style) '
style    = 'blue'
variable = 'LF_LEVEL'

[shell]
bash_indicator = 'bash'
disabled       = false
format         = '[ $indicator]($style) '
style          = 'black'
zsh_indicator  = 'zsh'

[username]
format      = '[ $user]($style)'
show_always = false
style_root  = 'bright-red'
style_user  = 'bright-black'

[hostname]
format   = '[@$hostname]($style) '
ssh_only = true
style    = 'bright-black'

[character]
error_symbol   = '[❯](red)'
success_symbol = '[❯](green)'

[cmd_duration]
format            = '[ $duration]($style)'
min_time          = 99
show_milliseconds = true
style             = 'yellow'

[status]
disabled   = false
format     = "$symbol[$int](red)"
map_symbol = false
symbol     = "[ 󰯈 ](red)"
