---
https://github.com/nvim-treesitter/nvim-treesitter:
  call:
    - - nvim
      - --headless
      - -u
      - NONE
      - +packadd nvim-treesitter
      # - +TSInstallSync all
      - +TSUpdateSync
      - +quitall
  lua: |-
    local opts = vim.g.ts_opts
    opts.auto_install = vim.fn.has("win32") == 0

    vim.o.foldmethod = "expr"
  vals:
    ts_opts:
      highlight:
        enable: true
        disable:
          - json
          - yaml
      incremental_selection:
        enable: true
        keymaps:
          init_selection: "+"
          node_decremental: "q"
          node_incremental: "+"
      # indent:
      #   enable: true
      textobjects:
        lsp_interop:
          enable: true
          peek_definition_code:
            L: "@function.outer"
            M: "@class.outer"
        select:
          enable: true
          lookahead: true
          keymaps:
            aa: "@parameter.outer"
            ab: "@block.outer"
            ac: "@conditional.outer"
            aC: "@class.outer"
            af: "@function.outer"
            aF: "@call.outer"
            aL: "@loop.outer"
            as: "@statement.outer"
            ia: "@parameter.inner"
            ib: "@block.inner"
            ic: "@conditional.inner"
            iC: "@class.inner"
            if: "@function.inner"
            iF: "@call.inner"
            iL: "@loop.inner"
            is: "@statement.outer"
        move:
          enable: true
          set_jumps: true
          goto_next_start:
            "][": "@statement.outer"
            "]m": "@block.outer"
          goto_next_end:
            "]]": "@statement.outer"
            "]M": "@block.outer"
          goto_previous_start:
            "[[": "@statement.outer"
            "[m": "@block.outer"
          goto_previous_end:
            "[]": "@statement.outer"
            "[M": "@block.outer"
        swap:
          enable: true
          swap_previous:
            <leader><left>: "@statement.outer"
            <leader><up>: "@block.outer"
          swap_next:
            <leader><right>: "@statement.outer"
            <leader><down>: "@block.outer"


