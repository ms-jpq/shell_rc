https://github.com/junegunn/fzf.vim:
  mvp: *mvp
  keys:
    - modes: n
      maps:
        "<leader>h": "<cmd>History:<cr>"
        "<leader>H": "<cmd>History/<cr>"
        "<leader>y": "<cmd>GFiles?<cr>"
        "<leader>Y": "<cmd>GFiles<cr>"
        "<leader>m": "<cmd>Jumps<cr>"
        "<leader>M": "<cmd>Marks<cr>"
        "<leader>o": "<cmd>BLines<cr>"
        "<leader>p": "<cmd>Buffers<cr>"
        "<leader>P": "<cmd>Files<cr>"
    - modes: n
      opts:
        silent: false
      maps:
        "<leader>O": "<cmd>RG<cr>"
  lua: |-
    local fzf_opts = vim.env.FZF_DEFAULT_OPTS or ""
    local new_opts = fzf_opts .. " --no-border"
    vim.env.FZF_DEFAULT_OPTS = new_opts
  lub: |-
    vim.cmd [[command! -bang -nargs=* RG call fzf#vim#grep2("rg --fixed-strings --column --line-number --no-heading --color=always --smart-case -- ", <q-args>, fzf#vim#with_preview(), <bang>0)]]
  vals:
    fzf_layout:
      window:
        height: 0.96
        width: 0.96
    fzf_vim:
      buffers_jump: true
      grep_multi_line: 2
      preview_window:
        - right:wrap


https://github.com/junegunn/vim-easy-align:
  mvp: *mvp
  keys:
    - modes: nv
      opts:
        noremap: false
      maps:
        "ga": "<plug>(EasyAlign)"


