---
jsonls:
  bin: vscode-json-language-server

yamlls:
  bin: yaml-language-server
  filetypes:
    - yaml
    - yaml.ansible
    - yaml.docker-compose
  # settings:
  #   yaml:
  #     keyOrdering: false

taplo:
  bin: taplo

typos_lsp:
  bin: typos-lsp
  init_options:
    diagnosticSeverity: Information

# harper_ls:
#   bin: harper-ls

lemminx:
  bin: lemminx
  args: []

contextive:
  bin: Contextive.LanguageServer_which

ast_grep:
  bin: ast-grep

# marksman:
#   bin: marksman

markdown:
  bin: vscode-markdown-language-server
  args:
    - --stdio
  filetypes:
    - markdown

# ltex:
#   bin: ltex-ls

ltex_plus:
  bin: ltex-ls-plus

texlab:
  bin: texlab
  settings:
    texlab:
      build:
        args:
          - -X
          - compile
          - --keep-intermediates
          - --keep-logs
          - --synctex
          - --
          - "%f"
        executable: tectonic
        # onSave: True
        # forwardSearchAfter: True
      # forwardSearch:
      #   executable: evince-synctex
      #   args:
      #     - "-f"
      #     - "%l"
      #     - "%p"
      #     - '"code -g %f:%l"'

digestif:
  bin: digestif

diagnosticls:
  bin: diagnostic-languageserver
  filetypes:
    - dockerfile
    - sh
    - zsh
  root:
    fallback: cwd
  init_options:
    filetypes:
      dockerfile:
        - hadolint
    linters:
      hadolint:
        args:
          - --format
          - json
          - --
          - "%file"
        command: hadolint
        parseJson:
          column: column
          line: line
          message: "${message} [${code}]"
          security: level
        rootPatterns:
          - .hadolint.yml
          - .hadolint.yaml
        securities:
          error: error
          info: info
          style: hint
          warning: warning
        sourceName: hadolint

