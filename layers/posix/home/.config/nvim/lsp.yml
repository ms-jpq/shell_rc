ltex_plus:
  bin: ltex-ls-plus.sh
  extensions:
    - .bib
    - .md
    - .org
    - .tex
    - .sty
    - .rst
    - .Rnw
    - .xhtml

texlab:
  bin: texlab
  settings:
    texlab:
      build:
        args:
          - -X
          - compile
          - --keep-intermediates
          - --keep-logs
          - --synctex
          - --
          - "%f"
        executable: tectonic
        # onSave: True
        # forwardSearchAfter: True
      # forwardSearch:
      #   executable: evince-synctex
      #   args:
      #     - "-f"
      #     - "%l"
      #     - "%p"
      #     - '"code -g %f:%l"'
  extensions:
    - .tex
    - .sty
    - .bib

digestif:
  bin: digestif
  extensions:
    - .tex
    - .sty

diagnosticls:
  bin: diagnostic-languageserver
  filetypes:
    - dockerfile
    - sh
    - zsh
  root:
    fallback: cwd
  init_options:
    filetypes:
      dockerfile:
        - hadolint
    linters:
      hadolint:
        args:
          - --format
          - json
          - --
          - "%file"
        command: hadolint
        parseJson:
          column: column
          line: line
          message: "${message} [${code}]"
          security: level
        rootPatterns:
          - .hadolint.yml
          - .hadolint.yaml
        securities:
          error: error
          info: info
          style: hint
          warning: warning
        sourceName: hadolint
  extensions:
    - .dockerfile
    - .sh
    - .zsh

bashls:
  bin: bash-language-server
  extensions:
    - .sh
    - .bash

jqls:
