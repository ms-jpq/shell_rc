---
jsonls:
  cmd:
    - vscode-json-language-server
    - --stdio
  sandbox:
    network: true

yamlls:
  cmd:
    - yaml-language-server
    - --stdio
  filetypes:
    - yaml
    - yaml.ansible
    - yaml.docker-compose
  sandbox:
    network: true
  # settings:
  #   yaml:
  #     keyOrdering: false

taplo:

typos_lsp:
  init_options:
    diagnosticSeverity: Information

# harper_ls:

lemminx:
  cmd:
    - lemminx
    - -Dlemminx.workdir=/var/tmp/lemminx
  extensions:
    .xml: xml

# marksman:

# markdown:
#   filetypes:
#     - markdown

ltex_plus:

texlab:
  settings:
    texlab:
      build:
        args:
          - -X
          - compile
          - --keep-intermediates
          - --keep-logs
          - --synctex
          - --
          - "%f"
        executable: tectonic
        # onSave: True
        # forwardSearchAfter: True
      # forwardSearch:
      #   executable: evince-synctex
      #   args:
      #     - "-f"
      #     - "%l"
      #     - "%p"
      #     - '"code -g %f:%l"'
  extensions:
    .tex: tex

digestif:
  extensions:
    .tex: tex

diagnosticls:
  filetypes:
    - dockerfile
    - sh
    - zsh
  root:
    fallback: cwd
  init_options:
    filetypes:
      dockerfile:
        - hadolint
    linters:
      hadolint:
        args:
          - --format
          - json
          - --
          - "%file"
        command: hadolint
        parseJson:
          column: column
          line: line
          message: "${message} [${code}]"
          security: level
        rootPatterns:
          - .hadolint.yml
          - .hadolint.yaml
        securities:
          error: error
          info: info
          style: hint
          warning: warning
        sourceName: hadolint

bashls:
  extensions:
    .bash: sh
    .sh: sh

jqls:

awk_ls:

systemd_lsp:
  extensions:
    .automount: systemd
    .dnssd: systemd
    .link: systemd
    .mount: systemd
    .netdev: systemd
    .network: systemd
    .service: systemd
    .socket: systemd
    .target: systemd

perlnavigator:
  extensions:
    .pl: perl
    .pm: perl

powershell_es:
  cmd:
    - powershell-lsp

dockerls:

docker_compose_language_service:

pyright:

# pylyzer:

# ruff_lsp:

hls:

rust_analyzer:

gopls:
  extensions:
    .mod: gomod

golangci_lint_ls:

sourcekit:

clangd:
  extensions:
    .c: c
    .cc: cpp
    .cpp: cpp
    .h: c
    .m: objc
    .mm: objcpp

ccls:
  extensions:
    .c: c
    .cc: cpp
    .cpp: cpp
    .h: c
    .m: objc
    .mm: objcpp

fortls:

ruby_lsp:
  cmd:
    - ruby-lsp

sorbet:

solargraph:

mdx_analyzer:
  extensions:
    .mdx: mdx

ts_ls:
  cmd:
    - typescript-language-server
    - --stdio
  extensions:
    .ts: typescript

prismals:

eslint:
  cmd:
    - vscode-eslint-language-server
    - --stdio
  settings:
    run: onSave
    rulesCustomizations:
      - rule: "*"
        severity: downgrade
      - rule: prettier/*
        severity: info

# denols:

superhtml:
  extensions:
    .htm: html
    .html: html

cssls:
  cmd:
    - vscode-css-language-server
    - --stdio

# tailwindcss:

svelte:

graphql:

vimls:

r_language_server:
  cmd:
    - r-lsp
  extensions:
    .R: r
    .r: r

julials:
  cmd:
    - julia-lsp

phan:

# psalm:

phpactor:

intelephense:
