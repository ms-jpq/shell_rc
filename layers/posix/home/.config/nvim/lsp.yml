---
jsonls:
  cmd:
    - vscode-json-language-server
    - --stdio
  extensions:
    .json: json
    .jsonc: jsonc

yamlls:
  cmd:
    - yaml-language-server
    - --stdio
  filetypes:
    - yaml
    - yaml.ansible
    - yaml.docker-compose
  extensions:
    .yml: yaml
    .yaml: yaml
  # settings:
  #   yaml:
  #     keyOrdering: false

taplo:
  extensions:
    .toml: toml

typos_lsp:
  init_options:
    diagnosticSeverity: Information

# harper_ls: {}

lemminx:
  cmd:
    - lemminx
    - -Dlemminx.workdir=/var/tmp/lemminx
  extensions:
    .svg: svg
    .xml: xml
    .xsd: xsd
    .xsl: xslt
    .xslt: xslt

ast_grep: {}

# marksman: {}

# markdown:
#   filetypes:
#     - markdown

ltex_plus: {}

texlab:
  settings:
    texlab:
      build:
        args:
          - -X
          - compile
          - --keep-intermediates
          - --keep-logs
          - --synctex
          - --
          - "%f"
        executable: tectonic
        # onSave: True
        # forwardSearchAfter: True
      # forwardSearch:
      #   executable: evince-synctex
      #   args:
      #     - "-f"
      #     - "%l"
      #     - "%p"
      #     - '"code -g %f:%l"'
  extensions:
    .bib: bib
    .sty: tex
    .tex: tex

digestif:
  extensions:
    .sty: tex
    .tex: tex

diagnosticls:
  filetypes:
    - dockerfile
    - sh
    - zsh
  root:
    fallback: cwd
  init_options:
    filetypes:
      dockerfile:
        - hadolint
    linters:
      hadolint:
        args:
          - --format
          - json
          - --
          - "%file"
        command: hadolint
        parseJson:
          column: column
          line: line
          message: "${message} [${code}]"
          security: level
        rootPatterns:
          - .hadolint.yml
          - .hadolint.yaml
        securities:
          error: error
          info: info
          style: hint
          warning: warning
        sourceName: hadolint

bashls:
  extensions:
    .bash: bash
    .sh: sh

jqls:
  extensions:
    .jq: jq

awk_ls:
  extensions:
    .awk: awk

systemd_lsp:
  extensions:
    .automount: systemd
    .dnssd: systemd
    .link: systemd
    .mount: systemd
    .netdev: systemd
    .network: systemd
    .service: systemd
    .socket: systemd
    .target: systemd

perlnavigator:
  extensions:
    .pl: perl
    .pm: perl

powershell_es:
  cmd:
    - powershell-lsp
  extensions:
    .ps1: ps1
    .psm1: ps1

dockerls:
  extensions:
    .dockerfile: dockerfile

docker_compose_language_service: {}

pyright:
  extensions:
    .py: python
    .pyi: python

# pylyzer: {}

# ruff_lsp: {}

hls:
  extensions:
