---
jsonls:
  extensions:
    - .json
    - .jsonc

yamlls:
  cmd:
    - yaml-language-server
    - --stdio
  filetypes:
    - yaml
    - yaml.ansible
    - yaml.docker-compose
  extensions:
    - .yml
    - .yaml
  # settings:
  #   yaml:
  #     keyOrdering: false

taplo:
  extensions:
    - .toml

typos_lsp:
  init_options:
    diagnosticSeverity: Information

# harper_ls: {}

lemminx:
  cmd:
    - lemminx
    - -Dlemminx.workdir=/var/tmp/lemminx
  extensions:
    - .svg
    - .xml
    - .xsd
    - .xsl
    - .xslt

ast_grep: {}

# marksman: {}

# markdown:
#   filetypes:
#     - markdown

ltex_plus: {}

texlab:
  settings:
    texlab:
      build:
        args:
          - -X
          - compile
          - --keep-intermediates
          - --keep-logs
          - --synctex
          - --
          - "%f"
        executable: tectonic
        # onSave: True
        # forwardSearchAfter: True
      # forwardSearch:
      #   executable: evince-synctex
      #   args:
      #     - "-f"
      #     - "%l"
      #     - "%p"
      #     - '"code -g %f:%l"'
  extensions:
    - .bib
    - .sty
    - .tex

digestif:
  extensions:
    - .sty
    - .tex

diagnosticls:
  filetypes:
    - dockerfile
    - sh
    - zsh
  root:
    fallback: cwd
  init_options:
    filetypes:
      dockerfile:
        - hadolint
    linters:
      hadolint:
        args:
          - --format
          - json
          - --
          - "%file"
        command: hadolint
        parseJson:
          column: column
          line: line
          message: "${message} [${code}]"
          security: level
        rootPatterns:
          - .hadolint.yml
          - .hadolint.yaml
        securities:
          error: error
          info: info
          style: hint
          warning: warning
        sourceName: hadolint

bashls:
  extensions:
    - .bash
    - .sh

jqls:
  extensions:
    - .jq

awk_ls:
  extensions:
    - .awk

systemd_lsp:
  extensions:
    - .automount
    - .dnssd
    - .link
    - .mount
    - .netdev
    - .network
    - .service
    - .socket
    - .target

perlnavigator:
  extensions:
    - .pl
    - .pm

powershell_es:
  cmd:
    - powershell-lsp
  extensions:
    - .ps1
    - .psm1

dockerls:
  extensions:
    - .dockerfile

docker_compose_language_service: {}

pyright:
  extensions:
    - .py
    - .pyi

# pylyzer: {}

# ruff_lsp: {}

hls:
