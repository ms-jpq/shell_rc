---
jsonls:
  bin: vscode-json-language-server
  extensions:
    - .json
    - .jsonc

yamlls:
  bin: yaml-language-server
  filetypes:
    - yaml
    - yaml.ansible
    - yaml.docker-compose
  extensions:
    - .yml
    - .yaml
  # settings:
  #   yaml:
  #     keyOrdering: false

taplo:
  bin: taplo
  extensions:
    - .toml

typos_lsp:
  bin: typos-lsp
  init_options:
    diagnosticSeverity: Information

# harper_ls:
#   bin: harper-ls

lemminx:
  bin: lemminx.jsh
  args:
    - -Dlemminx.workdir=/var/tmp/lemminx
  extensions:
    - .xml
    - .xsd
    - .xsl
    - .xslt
    - .svg

contextive:
  bin: Contextive.LanguageServer_which

ast_grep:
