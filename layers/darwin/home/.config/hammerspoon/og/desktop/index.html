<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src *;"
    />
    <style>
      html,
      body {
        border: 0;
        margin: 0;

        height: 100%;
        width: 100%;

        display: grid;
        overflow: hidden;
      }

      iframe {
        border: 0;
        place-self: center;

        aspect-ratio: 16 / 9;
        width: max(100vw, calc(100vh * 16 / 9));
      }
    </style>
    <title></title>
  </head>
  <body>
    <iframe
      allow="autoplay"
      referrerpolicy="strict-origin-when-cross-origin"
      sandbox="allow-same-origin allow-scripts"
    >
    </iframe>
    <script>
      ;(async () => {
        const response = await fetch("videos.json", { cache: "no-store" })
        const videos = await response.json()

        const parsed = videos
          .map((video) => {
            const url = new URL(video)
            return (
              url.searchParams.get("v") ??
              url.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/)?.[1]
            )
          })
          .filter(Boolean)

        const playlist = (() => {
          const shuffled = []
          for (const id of parsed.values()) {
            const position = Math.floor(Math.random() * (shuffled.length + 1))
            shuffled.splice(position, 0, id)
          }
          return shuffled.join(",")
        })()

        const params = new URLSearchParams({
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          iv_load_policy: 3,
          loop: 1,
          mute: 1,
          playlist,
          rel: 0,
        })

        document.querySelector("iframe").src =
          `https://www.youtube.com/embed/?${params}`
      })()
    </script>
  </body>
</html>
